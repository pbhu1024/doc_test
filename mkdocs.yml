site_name: OrcaGym 文档
site_url: https://pbhu1024.github.io/doc_test/
repo_name: pbhu1024/orcagym
repo_url: https://github.com/pbhu1024/doc_test

theme:
  name: material
  language: zh 
  icon:
    logo: material/robot-outline
    repo: fontawesome/brands/github

  palette:
    # 亮色模式（默认）
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 亮色模式
    # 暗色模式 - 赛博朋克风
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 暗色模式

  font:
    text: Roboto
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

copyright: Copyright &copy; 松应科技有限公司 
  # <a href="https://github.com/pbhu1024/orcagym/issues">反馈问题</a>

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/openverse-orca/OrcaGym
      name: OrcaGym on GitHub
    - icon: fontawesome/brands/weixin
      link: https://www.orca3d.cn/
      name: 松应科技有限公司

plugins:
  - search
  - i18n:
      docs_structure: folder          # 推荐用 suffix（也支持 folder）
      languages:
        - locale: zh
          default: true
          name: 简体中文
          site_name: OrcaGym 文档
